# One package: a v* tag publishes `piher` through Trusted Publishing (OIDC, no token) and then opens
# the GitHub Release for that tag. Prerequisite: this workflow is registered under Settings →
# Trusted Publishing for the npm package piher.
name: publish

on:
  push:
    tags:
      - 'v*'   # v-prefixed
      - '[0-9]*' # bare semver (e.g. 0.2.0)

# A re-run of the same tag must not race a second publish.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required by npm Trusted Publishing (OIDC)
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
      # npm Trusted Publishing (OIDC) needs npm >= 11.5; Node 22 ships npm 10.x
      - run: npm install -g npm@^11

      - name: Check tag matches the package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          EXT=$(node -p "require('./packages/ext/package.json').version")
          [ "$TAG" = "$EXT" ] || {
            echo "✗ tag v$TAG does not match the package version (piher=$EXT)"; exit 1; }

      - run: npm install --ignore-scripts

      - name: Test
        run: npm test

      # Published only when npm does not have this version yet: the first publish of a brand-new
      # package cannot use Trusted Publishing (npm requires the package to exist to register a
      # trusted publisher), so that one goes out by hand — see docs/RELEASE.md. A tag push
      # afterwards stays green instead of failing on a version npm already holds.
      - name: Publish piher
        working-directory: packages/ext
        run: |
          V=$(node -p "require('./package.json').version")
          if npm view "piher@$V" version >/dev/null 2>&1; then
            echo "piher@$V is already on npm — nothing to publish"
          else
            npm publish
          fi

  # The Release is written only after the package is on npm: a failed publish must not announce a
  # version nobody can install. Notes are GitHub's generated ones, with the conventional-commit
  # entries of commits that have no pull request merged into their category — the same notes the
  # other repos produce (see .github/release.yml and .github/scripts/merge-release-notes.mjs).
  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the notes need the previous tag and the whole compare range

      - name: Prepare release notes
        env:
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: node .github/scripts/merge-release-notes.mjs

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: .github/release-notes.md
